<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  // Streamlit custom component v1 (postMessage 프로토콜 직접 구현, 빌드 불필요).
  // 화면은 없고, 오답노트 JSON을 이 브라우저의 localStorage에 읽고 쓰는 일만 한다.
  var sentInitial = false;

  function send(msg) {
    msg.isStreamlitMessage = true;
    window.parent.postMessage(msg, "*");
  }

  function readStored(key) {
    try {
      var v = window.localStorage.getItem(key);
      return typeof v === "string" ? v : "";
    } catch (e) {
      return "";
    }
  }

  function onRender(event) {
    var data = event.data;
    if (!data || data.type !== "streamlit:render") return;
    var args = data.args || {};
    var key = args.storage_key;
    if (!key) return;

    // 한 iframe 생애에 한 번: 저장분을 먼저 읽어 Python에 알린다 (저장보다 먼저).
    if (!sentInitial) {
      sentInitial = true;
      send({ type: "streamlit:setComponentValue", value: readStored(key), dataType: "json" });
    }

    if (typeof args.save === "string") {
      try {
        if (args.save === "") {
          window.localStorage.removeItem(key);
        } else if (window.localStorage.getItem(key) !== args.save) {
          window.localStorage.setItem(key, args.save);
        }
      } catch (e) {
        // 용량 초과·저장소 차단: 조용히 넘어간다 (JSON 백업은 그대로 쓸 수 있음)
      }
    }
  }

  window.addEventListener("message", onRender);
  send({ type: "streamlit:componentReady", apiVersion: 1 });
  send({ type: "streamlit:setFrameHeight", height: 0 });
</script>
</body>
</html>
