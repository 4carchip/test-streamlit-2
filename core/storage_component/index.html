<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  // Streamlit custom component v1 (postMessage 프로토콜 직접 구현, 빌드 불필요).
  // 화면은 없고, 여러 키를 이 브라우저의 localStorage에 읽고 쓰는 일만 한다.
  // args.items = {저장 키: 저장 값}. 값이 null이면 건드리지 않고, ""이면 지우고, 그 밖의 문자열이면 저장한다.
  // 처음 한 번, 모든 키의 저장분을 {저장 키: 값 또는 ""}으로 한꺼번에 Python에 보낸다
  // (따로 보내면 rerun이 겹쳐 옛 위젯 값이 세션을 덮어쓴다 — core/browser_storage.py 참고).
  var sentInitial = false;

  function send(msg) {
    msg.isStreamlitMessage = true;
    window.parent.postMessage(msg, "*");
  }

  function readStored(key) {
    try {
      var v = window.localStorage.getItem(key);
      return typeof v === "string" ? v : "";
    } catch (e) {
      return "";
    }
  }

  function onRender(event) {
    var data = event.data;
    if (!data || data.type !== "streamlit:render") return;
    var items = (data.args && data.args.items) || {};
    var keys = Object.keys(items);
    if (!keys.length) return;

    // 한 iframe 생애에 한 번: 저장분을 먼저 읽어 Python에 알린다 (저장보다 먼저).
    if (!sentInitial) {
      sentInitial = true;
      var initial = {};
      keys.forEach(function (k) { initial[k] = readStored(k); });
      send({ type: "streamlit:setComponentValue", value: initial, dataType: "json" });
    }

    keys.forEach(function (k) {
      var save = items[k];
      if (typeof save !== "string") return;
      try {
        if (save === "") {
          window.localStorage.removeItem(k);
        } else if (window.localStorage.getItem(k) !== save) {
          window.localStorage.setItem(k, save);
        }
      } catch (e) {
        // 용량 초과·저장소 차단: 조용히 넘어간다
      }
    });
  }

  window.addEventListener("message", onRender);
  send({ type: "streamlit:componentReady", apiVersion: 1 });
  send({ type: "streamlit:setFrameHeight", height: 0 });
</script>
</body>
</html>
